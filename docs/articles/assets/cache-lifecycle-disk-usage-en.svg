<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640">
<title>Single-Node Disk Usage and Reclaimable Space</title><desc>Model cache, Docker images, volumes, and build cache; free space before and after cleanup.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="1120" height="640" fill="#ffffff"/>
<text x="40" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">Single-Node Disk Usage and Reclaimable Space</text><text x="40" y="66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">1.7 TB root filesystem; 53 GB free before cleanup, 691 GB after. Data from 2026-10-20.</text>
<text x="220" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">0</text>
<text x="900" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">600 GB</text>
<text x="204" y="148" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="end">Model cache / legacy dirs</text>
<rect x="220" y="130" width="154.13333333333333" height="30" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="384.1333333333333" y="150" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="600" text-anchor="start">136 GB</text>
<text x="204" y="206" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="end">Container images</text>
<rect x="220" y="188" width="221.90666666666667" height="30" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<rect x="441.90666666666664" y="188" width="446.3066666666667" height="30" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.0"/>
<text x="447.90666666666664" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.8" fill="#d97706" font-weight="600" text-anchor="start">66.8%</text>
<text x="898.2133333333334" y="208" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="600" text-anchor="start">589.6 GB</text>
<text x="204" y="264" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="end">Container volumes</text>
<rect x="220" y="246" width="354.73333333333335" height="30" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<rect x="574.7333333333333" y="246" width="148.35333333333332" height="30" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.0"/>
<text x="580.7333333333333" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="8.8" fill="#d97706" font-weight="600" text-anchor="start">29.5%</text>
<text x="733.0866666666666" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="600" text-anchor="start">443.9 GB</text>
<text x="204" y="322" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="end">Build cache</text>
<rect x="220" y="304" width="74.8" height="30" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<rect x="294.8" y="304" width="14.506666666666668" height="30" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.0"/>
<text x="319.3066666666667" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="600" text-anchor="start">78.8 GB (12.8 GB reclaimable, 16.2%)</text>
<rect x="220" y="370" width="18" height="12" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="246" y="381" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Retained / in use</text>
<rect x="390" y="370" width="18" height="12" rx="2" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.0"/>
<text x="416" y="381" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">Reclaimable</text>
<text x="40" y="440" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Root filesystem free space</text>
<text x="40" y="487" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">Before cleanup</text>
<rect x="160" y="465" width="760" height="28" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="896.3058823529411" y="465" width="23.694117647058825" height="28" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1.0"/>
<text x="930" y="484" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="600" text-anchor="start">53 GB free (3.1%)</text>
<text x="40" y="532" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="600" text-anchor="start">After cleanup</text>
<rect x="160" y="510" width="760" height="28" rx="5" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="611.0823529411764" y="510" width="308.91764705882355" height="28" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.0"/>
<text x="930" y="529" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="600" text-anchor="start">691 GB free (40.6%)</text>
<rect x="160" y="556" width="16" height="12" rx="3" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="182" y="566" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">Used</text>
<rect x="270" y="556" width="16" height="12" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1.0"/>
<text x="292" y="566" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">Free before</text>
<rect x="430" y="556" width="16" height="12" rx="3" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.0"/>
<text x="452" y="566" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">Free after</text>
<text x="40" y="590" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">Model dir 136 GB to 15–16 GB, 88.2%–89.0% smaller; images, volumes, and build cache have separate owners.</text>
<text x="40" y="614" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">Before /data/models was 136 GB; after cleanup it was 15–16 GB. Running models stayed healthy.</text>
</svg>
