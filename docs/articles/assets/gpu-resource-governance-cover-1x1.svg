<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
<title>OpenMaas GPU resource governance square cover</title>
<desc>Square cover for the article: Four Resources on One GPU.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="0.55" stop-color="#0c1d38"/><stop offset="1" stop-color="#0f2b4e"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/></pattern>
</defs>
<rect width="500" height="500" fill="url(#bg)"/>
<rect width="500" height="500" fill="url(#grid)"/>
<rect x="34" y="28" width="4" height="24" rx="2" fill="url(#accent)"/>
<text x="50" y="46" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="15" fill="#93c5fd" font-weight="700" text-anchor="start">OpenMaas</text>
<text x="50" y="64" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#8da4c4" font-weight="normal" text-anchor="start">Building OpenMaas · GPU Resource Governance</text>
<text x="50" y="142" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start">一块 GPU 上的</text>
<text x="50" y="180" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="38" fill="#dbeeff" font-weight="700" text-anchor="start">四种资源</text>
<text x="52" y="212" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb6d4" font-weight="normal" text-anchor="start">训推平台的 GPU 资源治理</text>
