<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430">
<title>GPU lease lifecycle</title><desc>Queued, reserved, running, releasing, released, and orphaned.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs><rect width="1040" height="430" fill="#ffffff"/>

<text x="40" y="38" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">GPU lease lifecycle</text>
<text x="40" y="61" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">Release requested is not release confirmed. The gap is where orphaned leases appear.</text>
<rect x="55" y="110" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
<text x="130" y="142" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="700" text-anchor="middle">QUEUED</text>
<rect x="235" y="110" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
<text x="310" y="142" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="700" text-anchor="middle">RESERVED</text>
<rect x="415" y="110" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
<text x="490" y="142" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="700" text-anchor="middle">RUNNING</text>
<rect x="595" y="110" width="150" height="54" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" />
<text x="670" y="142" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="700" text-anchor="middle">RELEASING</text>
<rect x="775" y="110" width="150" height="54" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4" />
<text x="850" y="142" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#166534" font-weight="700" text-anchor="middle">RELEASED</text>
<path d="M 205 137 L 235 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 385 137 L 415 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 565 137 L 595 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 745 137 L 775 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 670 164 L 670 240" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<rect x="595" y="240" width="150" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4" />
<text x="670" y="272" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#991b1b" font-weight="700" text-anchor="middle">ORPHANED</text>
<text x="40" y="325" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="start">QUEUED / RESERVED can also expire or be cancelled; the diagram keeps the main resource path.</text>
<rect x="40" y="348" width="960" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1" />
<text x="58" y="371" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="start">RESERVED: budget locked, worker may not be loaded yet.</text>
<text x="58" y="391" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="start">RELEASING: release requested, VRAM not necessarily returned.  RELEASED: device delta confirmed.</text>
</svg>