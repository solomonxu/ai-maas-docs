<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
<title>释放与驱逐</title><desc>左侧是空闲冷却释放，右侧是有边界的优先级驱逐。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs><rect width="1100" height="600" fill="#ffffff"/>

<text x="40" y="38" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">释放与驱逐</text>
<text x="40" y="61" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">两条路径都需要安全条件与显式确认。</text>
<rect x="40" y="92" width="500" height="430" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.4" filter="url(#shadow)"/>
<text x="62" y="122" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="15" fill="#1e3a8a" font-weight="700" text-anchor="start">空闲冷却释放</text>
<text x="62" y="143" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">模型先保持驻留，空闲后卸载。</text>
<rect x="90" y="176" width="370" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="110" y="200" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="start">已加载</text>
<text x="110" y="217" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b" font-weight="normal" text-anchor="start">LOADED</text>
<text x="300" y="210" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">最后一次使用开始计时</text>
<rect x="90" y="256" width="370" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="110" y="280" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="start">空闲 TTL</text>
<text x="300" y="290" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">无在途请求</text>
<rect x="90" y="336" width="370" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="110" y="360" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="start">卸载中</text>
<text x="110" y="377" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b" font-weight="normal" text-anchor="start">UNLOADING</text>
<text x="300" y="370" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">确认显存归还</text>
<rect x="90" y="416" width="370" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="110" y="440" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="start">冷态</text>
<text x="110" y="457" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b" font-weight="normal" text-anchor="start">COLD</text>
<path d="M 275 230 V 256" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<path d="M 275 310 V 336" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<path d="M 275 390 V 416" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<text x="62" y="493" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">卸载确认后释放租约；卸载失败保持 LOADED。</text>
<rect x="560" y="92" width="500" height="430" rx="14" fill="#fffaf5" stroke="#fdba74" stroke-width="1.4" filter="url(#shadow)"/>
<text x="582" y="122" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="15" fill="#9a3412" font-weight="700" text-anchor="start">有边界的优先级驱逐</text>
<text x="582" y="143" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">高优需求选择安全的低优任务。</text>
<rect x="610" y="176" width="420" height="54" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" />
<text x="630" y="208" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#7c2d12" font-weight="700" text-anchor="start">高优需求</text>
<text x="830" y="208" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="normal" text-anchor="start">先让出</text>
<rect x="610" y="256" width="420" height="54" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" />
<text x="630" y="288" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#7c2d12" font-weight="700" text-anchor="start">安全点让出</text>
<text x="830" y="288" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="normal" text-anchor="start">仅安全且允许</text>
<rect x="610" y="336" width="420" height="54" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" />
<text x="630" y="368" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#7c2d12" font-weight="700" text-anchor="start">检查点 / 取消 / 重排队</text>
<text x="830" y="368" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="normal" text-anchor="start">审计 + 用户可见原因</text>
<rect x="610" y="416" width="420" height="54" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" />
<text x="630" y="448" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#7c2d12" font-weight="700" text-anchor="start">释放租约 → 准入</text>
<path d="M 820 230 V 256" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
<path d="M 820 310 V 336" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
<path d="M 820 390 V 416" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
<text x="582" y="493" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">不进行任意强制终止；不可恢复任务走准入/取消路径。</text>
</svg>