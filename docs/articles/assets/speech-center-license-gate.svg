<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
<title>许可证门禁</title><desc>代码、权重、音色分别记录，commercialUse 决定服务绑定。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="1120" height="620" fill="#ffffff"/>
<text x="40" y="42" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">许可证门禁</text><text x="40" y="66" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">代码、权重、音色三层都满足商用要求，引擎才进入默认可商用服务。</text>
<rect x="40" y="120" width="240" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="60" y="152" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">引擎说明</text>
<text x="60" y="176" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">代码 / 模型 / 音色</text>
<text x="60" y="194" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">许可证字段完整</text>
<path d="M 280 166 L 330 166" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="330" y="120" width="140" height="92" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="400" y="152" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">代码许可证</text>
<text x="400" y="176" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">独立记录</text>
<text x="400" y="194" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">许可证编号 / 来源</text>
<path d="M 400 212 L 590 250" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<rect x="490" y="120" width="140" height="92" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
<text x="560" y="152" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">权重许可证</text>
<text x="560" y="176" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">独立记录</text>
<text x="560" y="194" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">许可证编号 / 来源</text>
<path d="M 560 212 L 590 250" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<rect x="650" y="120" width="140" height="92" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="720" y="152" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle">音色 / 语言包</text>
<text x="720" y="176" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">独立记录</text>
<text x="720" y="194" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="middle">许可证编号 / 来源</text>
<path d="M 720 212 L 590 250" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<rect x="470" y="250" width="260" height="82" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="490" y="282" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">可商用标记为真</text>
<text x="490" y="306" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">三层都通过，才可绑定服务</text>
<path d="M 730 291 L 790 291" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#arrow-green)"/>
<rect x="790" y="248" width="270" height="86" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
<text x="810" y="280" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="13" fill="#059669" font-weight="700" text-anchor="start">进入默认可商用服务</text>
<text x="810" y="304" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">记录引擎、模型、音色、许可证</text>
<path d="M 730 291 L 760 400" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<rect x="700" y="390" width="360" height="70" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
<text x="720" y="420" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#dc2626" font-weight="700" text-anchor="start">可商用标记为假</text>
<text x="720" y="442" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">单独标记；不进入默认可商用集合</text>
<text x="40" y="520" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">示例：Kokoro 为 Apache-2.0；Piper 1.2.0 为 MIT，1.8.0 为 GPL；XTTS-v2 为非商用。</text>
<text x="40" y="548" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">许可证是服务绑定条件；具体分发和音色授权由法务确认。</text>
</svg>
