<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<title>Speech Task States</title><desc>Queued, running, succeeded, failed, cancelled, expired; cleanup, source, and retention.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="1200" height="700" fill="#ffffff"/>
<text x="40" y="42" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">Speech Task States</text><text x="40" y="66" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">How submit, lease, retry, cancel, and expiry close out.</text>
<rect x="60" y="230" width="150" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="135" y="260" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">Queued</text><text x="135" y="280" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">waiting for pickup</text>
<rect x="290" y="230" width="150" height="72" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/><text x="365" y="260" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">Running</text><text x="365" y="280" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">worker processing</text>
<rect x="550" y="120" width="150" height="72" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.3"/><text x="625" y="150" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">Succeeded</text><text x="625" y="170" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">result available</text>
<rect x="550" y="230" width="150" height="72" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/><text x="625" y="260" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">Failed</text><text x="625" y="280" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">error preserved</text>
<rect x="550" y="340" width="150" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><text x="625" y="370" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">Cancelled</text><text x="625" y="390" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">execution stopped</text>
<rect x="840" y="230" width="150" height="72" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/><text x="915" y="260" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#0f172a" font-weight="700" text-anchor="middle">Expired</text><text x="915" y="280" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">result expired</text>
<path d="M 210 266 L 288 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M 440 260 L 548 156" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M 440 266 L 548 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M 440 272 L 548 376" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<path d="M 700 156 L 838 250" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="744" y="180" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">retention</text>
<path d="M 700 266 L 838 266" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="750" y="256" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">retention</text>
<path d="M 700 376 L 838 282" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="744" y="356" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">retention</text>
<rect x="290" y="440" width="360" height="72" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="310" y="468" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">Cleanup process</text>
<text x="310" y="490" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">reclaims expired leases; requeue or fail</text>
<path d="M 365 302 L 365 438" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="375" y="390" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="start">lease expired</text>
<rect x="40" y="550" width="520" height="70" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
<text x="60" y="578" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Center jobs</text>
<text x="60" y="600" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">center history; 30 days</text>
<rect x="590" y="550" width="570" height="70" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="610" y="578" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">Chat jobs</text>
<text x="610" y="600" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">dictation / read-aloud; 24 hours; outside center history</text>
<text x="40" y="660" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">Task and result states stay separate: a terminal task can leave a result behind; downloads use an authenticated proxy.</text>
</svg>
