<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
<title>Release and eviction</title><desc>Idle cooldown release on the left; bounded priority eviction on the right.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs><rect width="1100" height="600" fill="#ffffff"/>

<text x="40" y="38" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">Release and eviction</text>
<text x="40" y="61" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">Both paths need safe conditions and explicit confirmation.</text>
<rect x="40" y="92" width="500" height="430" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.4" filter="url(#shadow)"/>
<text x="62" y="122" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="15" fill="#1e3a8a" font-weight="700" text-anchor="start">Idle cooldown release</text>
<text x="62" y="143" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">The model stays warm, then unloads when idle.</text>
<rect x="90" y="176" width="370" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="110" y="208" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="start">LOADED</text>
<rect x="90" y="256" width="370" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="110" y="288" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="start">idle TTL</text>
<rect x="90" y="336" width="370" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="110" y="368" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="start">UNLOADING</text>
<rect x="90" y="416" width="370" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="110" y="448" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="700" text-anchor="start">COLD</text>
<path d="M 275 230 V 256" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<path d="M 275 310 V 336" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<path d="M 275 390 V 416" fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
<text x="300" y="209" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">last use starts the timer</text>
<text x="300" y="289" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">no in-flight request</text>
<text x="300" y="369" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">confirm VRAM returned</text>
<text x="62" y="493" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">Lease released after unload confirmation; failure stays LOADED.</text>
<rect x="560" y="92" width="500" height="430" rx="14" fill="#fffaf5" stroke="#fdba74" stroke-width="1.4" filter="url(#shadow)"/>
<text x="582" y="122" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="15" fill="#9a3412" font-weight="700" text-anchor="start">Bounded priority eviction</text>
<text x="582" y="143" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">High-priority demand selects a safe lower-priority task.</text>
<rect x="610" y="176" width="420" height="54" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" />
<text x="630" y="208" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#7c2d12" font-weight="700" text-anchor="start">high-priority demand</text>
<rect x="610" y="256" width="420" height="54" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" />
<text x="630" y="288" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#7c2d12" font-weight="700" text-anchor="start">safe-point yield</text>
<rect x="610" y="336" width="420" height="54" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" />
<text x="630" y="368" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#7c2d12" font-weight="700" text-anchor="start">checkpoint / cancel / requeue</text>
<rect x="610" y="416" width="420" height="54" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2" />
<text x="630" y="448" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#7c2d12" font-weight="700" text-anchor="start">release lease → admit</text>
<path d="M 820 230 V 256" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
<path d="M 820 310 V 336" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
<path d="M 820 390 V 416" fill="none" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow-amber)"/>
<text x="840" y="209" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="normal" text-anchor="start">yield first</text>
<text x="840" y="289" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="normal" text-anchor="start">only if safe &amp; allowed</text>
<text x="840" y="369" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="normal" text-anchor="start">audit + user-visible reason</text>
<text x="582" y="493" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">No arbitrary force-kill; unrecoverable jobs stay in admission/cancel paths.</text>
</svg>