<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430">
<title>GPU 租约生命周期</title><desc>排队、预留、运行、释放与孤儿状态。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs><rect width="1040" height="430" fill="#ffffff"/>

<text x="40" y="38" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">GPU 租约生命周期</text>
<text x="40" y="61" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">释放请求不等于释放确认；两者之间会出现孤儿租约。</text>
<rect x="55" y="110" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
<text x="130" y="133" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="middle">排队中</text>
<text x="130" y="150" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b" font-weight="normal" text-anchor="middle">QUEUED</text>
<rect x="235" y="110" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
<text x="310" y="133" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="middle">已预留</text>
<text x="310" y="150" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b" font-weight="normal" text-anchor="middle">RESERVED</text>
<rect x="415" y="110" width="150" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
<text x="490" y="133" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="middle">运行中</text>
<text x="490" y="150" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b" font-weight="normal" text-anchor="middle">RUNNING</text>
<rect x="595" y="110" width="150" height="54" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" />
<text x="670" y="133" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="middle">释放中</text>
<text x="670" y="150" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b" font-weight="normal" text-anchor="middle">RELEASING</text>
<rect x="775" y="110" width="150" height="54" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4" />
<text x="850" y="133" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="700" text-anchor="middle">已释放</text>
<text x="850" y="150" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#64748b" font-weight="normal" text-anchor="middle">RELEASED</text>
<path d="M 205 137 L 235 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 385 137 L 415 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 565 137 L 595 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 745 137 L 775 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 670 164 L 670 240" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<rect x="595" y="240" width="150" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4" />
<text x="670" y="265" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#991b1b" font-weight="700" text-anchor="middle">待确认</text>
<text x="670" y="281" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#991b1b" font-weight="normal" text-anchor="middle">ORPHANED</text>
<text x="40" y="325" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="start">QUEUED / RESERVED 也可能过期或被取消；这里保留主要资源路径。</text>
<rect x="40" y="348" width="960" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1" />
<text x="58" y="371" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="start">RESERVED：预算已锁定，worker 可能尚未加载。</text>
<text x="58" y="391" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="start">RELEASING：释放请求已发出，显存未必归还。RELEASED：设备显存确认下降。</text>
</svg>