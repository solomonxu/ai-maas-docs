<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
<title>磁盘水位与动作</title><desc>磁盘使用率 75%、85%、95% 对应的回收与拒绝动作。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="1100" height="500" fill="#ffffff"/>
<text x="40" y="42" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">磁盘水位与动作</text><text x="40" y="66" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="12" fill="#64748b" font-weight="400" text-anchor="start">75% 低水位、85% 高水位、95% 预检。95% 预检当前尚未落地。</text>
<rect x="80.0" y="190" width="705.0" height="58" rx="5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.0"/>
<text x="432.5" y="225" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="11" fill="#0f172a" font-weight="700" text-anchor="middle">正常</text>
<rect x="785.0" y="190" width="94.0" height="58" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="832.0" y="225" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="11" fill="#0f172a" font-weight="700" text-anchor="middle">回收</text>
<rect x="879.0" y="190" width="94.0" height="58" rx="5" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.0"/>
<text x="926.0" y="225" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="11" fill="#0f172a" font-weight="700" text-anchor="middle">加速回收</text>
<rect x="973.0" y="190" width="47.0" height="58" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1.0"/>
<path d="M 80.0 178 L 80.0 256" fill="none" stroke="#64748b" stroke-width="1.0"/>
<text x="80.0" y="278" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10" fill="#64748b" font-weight="600" text-anchor="middle">0%</text>
<path d="M 785.0 178 L 785.0 256" fill="none" stroke="#64748b" stroke-width="1.0"/>
<text x="785.0" y="278" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10" fill="#64748b" font-weight="600" text-anchor="middle">75%</text>
<path d="M 879.0 178 L 879.0 256" fill="none" stroke="#64748b" stroke-width="1.0"/>
<text x="879.0" y="278" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10" fill="#64748b" font-weight="600" text-anchor="middle">85%</text>
<path d="M 973.0 178 L 973.0 256" fill="none" stroke="#64748b" stroke-width="1.0"/>
<text x="973.0" y="278" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10" fill="#64748b" font-weight="600" text-anchor="middle">95%</text>
<path d="M 1020.0 178 L 1020.0 256" fill="none" stroke="#64748b" stroke-width="1.0"/>
<text x="1020.0" y="278" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10" fill="#64748b" font-weight="600" text-anchor="middle">100%</text>
<text x="80" y="145" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">根盘使用率</text>
<rect x="40" y="340" width="245" height="84" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
<text x="56" y="368" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="11.5" fill="#059669" font-weight="700" text-anchor="start">75% 以下</text>
<text x="56" y="389" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">保持正常回收，留出余量。</text>
<rect x="305" y="340" width="245" height="84" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="321" y="368" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="11.5" fill="#2563eb" font-weight="700" text-anchor="start">75–85%</text>
<text x="321" y="389" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">按 TTL 与 LRU 回收，观察增长趋势。</text>
<rect x="570" y="340" width="245" height="84" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
<text x="586" y="368" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="11.5" fill="#d97706" font-weight="700" text-anchor="start">85–95%</text>
<text x="586" y="389" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">更高频回收，检查镜像和大模型部署。</text>
<rect x="835" y="340" width="245" height="84" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
<text x="851" y="368" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="11.5" fill="#dc2626" font-weight="700" text-anchor="start">95% 以上</text>
<text x="851" y="389" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">计划：拒绝新下载，要求人工处理。</text>
<text x="851" y="406" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9" fill="#dc2626" font-weight="600" text-anchor="start">当前：未实现</text>
<text x="40" y="468" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">水位不是唯一判断：还要看 inode、page cache、镜像层、挂载和活跃加载任务。</text>
</svg>
