<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400">
<title>Pipeline run state machine</title>
<desc>Happy path, failure retry, and cancellation states for a pipeline run.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
  </filter>
</defs>
<rect width="1040" height="400" fill="#ffffff"/>

<text x="40" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">Pipeline run state machine</text>
<text x="40" y="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">The happy path stays on top; retry and cancellation are explicit branches.</text>
<rect x="50" y="110" width="140" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" />
<text x="120" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">DRAFT</text>
<rect x="220" y="110" width="140" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" />
<text x="290" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">PREFLIGHTED</text>
<rect x="390" y="110" width="140" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" />
<text x="460" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="middle">QUEUED</text>
<rect x="560" y="110" width="140" height="54" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
<text x="630" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#1e3a8a" font-weight="700" text-anchor="middle">RUNNING</text>
<rect x="730" y="110" width="140" height="54" rx="10" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4" />
<text x="800" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#166534" font-weight="700" text-anchor="middle">SUCCEEDED</text>
<path d="M 190 137 L 220 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 360 137 L 390 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 530 137 L 560 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<path d="M 700 137 L 730 137" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<text x="360" y="96" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="middle">pass</text>
<text x="530" y="96" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="middle">start</text>
<text x="700" y="96" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="middle">lease</text>
<rect x="560" y="292" width="140" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4" />
<text x="630" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#991b1b" font-weight="700" text-anchor="middle">FAILED</text>
<path d="M 630 164 L 630 292" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow)"/>
<path d="M 560 319 H 460 V 219 H 460 V 164" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="374" y="250" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#b45309" font-weight="600" text-anchor="start">retry from failed stage</text>
<text x="820" y="282" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="middle">cancel from any non-terminal state</text>
<rect x="820" y="292" width="140" height="54" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" />
<text x="890" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#475569" font-weight="700" text-anchor="middle">CANCELLED</text>
<text x="220" y="196" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="start">BLOCK cannot enter QUEUED</text>
<text x="220" y="213" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="start">WARN requires explicit confirmation</text>
</svg>