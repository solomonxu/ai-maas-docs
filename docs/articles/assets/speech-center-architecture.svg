<text x="850" y="281" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start">CPU / 合成引擎</text>
<text x="850" y="300" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">按音色选择引擎</text>
<text x="850" y="318" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">内部调用 + 临时地址</text>
<path d="M 780 180 L 828 145" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
<text x="794" y="150" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#059669" font-weight="600" text-anchor="start">转写</text>
<path d="M 780 245 L 828 275" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
<text x="794" y="255" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#d97706" font-weight="600" text-anchor="start">合成</text>
<rect x="460" y="430" width="250" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="480" y="460" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">任务库</text>
<text x="480" y="482" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">任务记录</text>
<text x="480" y="500" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">任务、状态、保留期</text>
<rect x="730" y="430" width="200" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="750" y="460" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">配额缓存</text>
<text x="750" y="482" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">配额 / 租约</text>
<rect x="950" y="430" width="210" height="100" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="970" y="460" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="14" fill="#0f172a" font-weight="700" text-anchor="start">对象存储</text>
<text x="970" y="482" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">输入音频</text>
<text x="970" y="500" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">合成结果</text>
<path d="M 620 350 L 585 428" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<path d="M 680 350 L 830 428" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<path d="M 740 350 L 1050 428" fill="none" stroke="#64748b" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="40" y="610" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">边界：客户端只调用 语音服务；执行器只在集群内访问；音频下载走鉴权代理。</text>
<rect x="40" y="650" width="1120" height="70" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="60" y="680" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="700" text-anchor="start">应用面</text>
<text x="150" y="680" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">默认关闭，按需启用；不影响训练和推理主链路。</text>
<text x="40" y="735" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">实线：请求 / 任务下发　　虚线：状态、配额、对象读写</text>
</svg>
