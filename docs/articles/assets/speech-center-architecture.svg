<text x="290" y="173" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="400" text-anchor="start">鉴权、租户、路由</text>
<path d="M 220 159 L 268 159" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<rect x="460" y="100" width="320" height="250" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
