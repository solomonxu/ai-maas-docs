<text x="496" y="311" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="start">网页与脚本共用任务</text>
<path d="M 420 159 L 458 159" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<rect x="830" y="100" width="330" height="110" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.3"/>
