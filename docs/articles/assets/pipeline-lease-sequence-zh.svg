<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360">
<title>GPU 租约接管时序</title><desc>执行器在 pipeline-service 内部，通过仓储访问 PostgreSQL；租约过期后其他副本可以接管。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs><rect width="1040" height="360" fill="#ffffff"/>

<text x="40" y="38" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">租约接管时序</text>
<text x="40" y="60" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">执行器在 pipeline-service 内部，通过仓储访问 PostgreSQL。</text>
<rect x="80" y="92" width="140" height="44" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="150" y="119" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">pipeline-service A</text>
<rect x="430" y="92" width="140" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
<text x="500" y="119" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">PostgreSQL</text>
<rect x="750" y="92" width="140" height="44" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="820" y="119" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#0f172a" font-weight="700" text-anchor="middle">pipeline-service B</text>
<path d="M 150 150 L 150 320" fill="none" stroke="#93c5fd" stroke-width="1.3"/>
<path d="M 500 150 L 500 320" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
<path d="M 820 150 L 820 320" fill="none" stroke="#86efac" stroke-width="1.3"/>
<path d="M 150 175 L 500 175" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="325.0" y="167" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#2563eb" font-weight="600" text-anchor="middle">领取 QUEUED 运行（SKIP LOCKED）</text>
<path d="M 500 207 L 150 207" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325.0" y="199" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="600" text-anchor="middle">返回租约</text>
<path d="M 150 239 L 500 239" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="325.0" y="231" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#2563eb" font-weight="600" text-anchor="middle">刷新租约心跳</text>
<path d="M 500 271 L 820 271" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="660.0" y="263" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#d97706" font-weight="600" text-anchor="middle">租约过期</text>
<path d="M 820 303 L 500 303" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="660.0" y="295" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">接管运行，从当前阶段继续</text>
<text x="150" y="340" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="#b45309" fill="600" font-weight="normal" text-anchor="start">服务停止 / 崩溃</text>
</svg>