<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<title>调度器视角与任务视角</title><desc>调度器看到粗粒度状态，任务视角看到需求、让出、运行和降级。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs><rect width="1100" height="560" fill="#ffffff"/>

<text x="40" y="38" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">调度器视角与任务视角</text>
<text x="40" y="61" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">RUNNING 状态条里可能包含一次让出；WAITING 状态条里可能包含一段短运行。</text>
<text x="40" y="105" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="start">调度器视角</text>
<text x="40" y="300" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="700" text-anchor="start">任务视角</text>
<path d="M 230 105 L 1040 105" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<path d="M 230 300 L 1040 300" fill="none" stroke="#e2e8f0" stroke-width="1"/>
<rect x="230" y="130" width="760" height="24" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="0" />
<text x="242" y="147" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#1e3a8a" font-weight="700" text-anchor="start">翻译：等待</text>
<rect x="230" y="190" width="760" height="24" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="0" />
<text x="242" y="207" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#166534" font-weight="700" text-anchor="start">文生图：运行</text>
<text x="1010" y="207" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="start">粗粒度状态</text>
<rect x="230" y="325" width="180" height="24" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="0" />
<text x="240" y="342" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#1e3a8a" font-weight="600" text-anchor="start">需求 + 等待</text>
<rect x="410" y="325" width="80" height="24" rx="8" fill="#60a5fa" stroke="#3b82f6" stroke-width="0" />
<text x="430" y="342" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#ffffff" font-weight="700" text-anchor="start">运行</text>
<rect x="490" y="325" width="260" height="24" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0" />
<text x="500" y="342" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#1e3a8a" font-weight="600" text-anchor="start">等待 / 降级截止</text>
<rect x="750" y="325" width="70" height="24" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="0" />
<text x="765" y="342" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#166534" font-weight="700" text-anchor="start">结果</text>
<rect x="230" y="390" width="220" height="24" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="0" />
<text x="240" y="407" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#166534" font-weight="600" text-anchor="start">step</text>
<rect x="450" y="390" width="80" height="24" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="0" />
<text x="470" y="407" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#92400e" font-weight="700" text-anchor="start">让出</text>
<rect x="530" y="390" width="460" height="24" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="0" />
<text x="540" y="407" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#166534" font-weight="600" text-anchor="start">安全点后恢复</text>
<path d="M 480 260 L 480 320" fill="none" stroke="#d97706" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-amber)"/>
<text x="490" y="280" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#b45309" font-weight="600" text-anchor="start">让出窗口</text>
<path d="M 820 260 L 820 320" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="830" y="280" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">粗粒度状态条看不到</text>
<text x="230" y="465" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="middle">0s</text>
<text x="410" y="465" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="middle">5s</text>
<text x="490" y="465" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="middle">10s</text>
<text x="750" y="465" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="middle">20s</text>
<text x="990" y="465" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="middle">30s</text>
<rect x="40" y="495" width="1020" height="44" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
<text x="58" y="521" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="normal" text-anchor="start">让出释放的是计算时间。如果显存或 LLM 容量仍不足，翻译仍会走 CPU 降级。</text>
</svg>