<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<title>缓存条目生命周期与自动回收</title><desc>TEMP、COMPLETE、IDLE、EVICTABLE、DELETING 状态及 TTL、LRU、水位和活跃任务保护。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<text x="40" y="42" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">缓存条目生命周期与自动回收</text><text x="40" y="66" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="12" fill="#64748b" font-weight="400" text-anchor="start">自动 GC 启动后延迟 5 分钟执行，之后每 6 小时一次；加载或推理中的条目会被跳过。</text>
<rect x="40" y="230" width="180" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="130.0" y="260" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">TEMP</text>
<text x="130.0" y="280" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">.tmp-* 下载中</text>
<path d="M 220 266 L 268 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="270" y="230" width="180" height="72" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.3"/>
<text x="360.0" y="260" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">COMPLETE</text>
<text x="360.0" y="280" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">校验通过，可命中</text>
<path d="M 450 266 L 498 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="500" y="230" width="180" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="590.0" y="260" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">IDLE</text>
<text x="590.0" y="280" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">完整，暂未使用</text>
<path d="M 680 266 L 728 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="730" y="230" width="180" height="72" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
<text x="820.0" y="260" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">EVICTABLE</text>
<text x="820.0" y="280" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">TTL / LRU / 水位</text>
<path d="M 910 266 L 958 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="960" y="230" width="180" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="1050.0" y="260" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">DELETING</text>
<text x="1050.0" y="280" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">删除中</text>
<rect x="430" y="100" width="320" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="590" y="126" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="13" fill="#1e3a8a" font-weight="700" text-anchor="middle">ACTIVE / PINNED</text>
<text x="590" y="145" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">加载中或正在推理，GC 跳过</text>
<path d="M 590 162 L 590 228" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
<rect x="40" y="365" width="1120" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60" y="393" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">触发条件与保护</text>
<rect x="60" y="403" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="84" y="416" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">TEMP → 清理</text>
<text x="210" y="416" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">超过 1 小时未完成</text>
<rect x="600" y="403" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="624" y="416" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">IDLE → EVICTABLE</text>
<text x="750" y="416" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">超过 14 天未使用，或触发容量水位</text>
<rect x="60" y="445" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="84" y="458" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">LRU 顺序</text>
<text x="210" y="458" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">按 .last-used 从旧到新回收</text>
<rect x="600" y="445" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="624" y="458" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">容量与水位</text>
<text x="750" y="458" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">最大 200GiB；高水位 85%，低水位 75%</text>
<rect x="60" y="487" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="84" y="500" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">保护</text>
<text x="210" y="500" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">加载中的 _active_task 跳过</text>
<rect x="600" y="487" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="624" y="500" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">删除失败</text>
<text x="750" y="500" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">保留下载状态，下一轮继续</text>
<text x="40" y="605" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">图是概念模型：COMPLETE 依赖 .complete 与 manifest 摘要；删除动作还要受文件锁和打开文件影响。</text>
<text x="40" y="635" font-family='Inter, "Noto Sans CJK SC", "Noto Sans SC", "Segoe UI", Arial, sans-serif' font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">旧 endpoint 目录使用 cleanup-legacy-model-cache.sh 做迁移清理，不属于日常 GC。</text>
</svg>
