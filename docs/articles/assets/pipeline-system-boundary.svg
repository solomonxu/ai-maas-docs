<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700">
<title>OpenMaas pipeline boundary</title>
<desc>Layered view of user intent, pipeline orchestration, domain services, Python runtimes, and infrastructure.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
  </marker>
  <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
  </filter>
</defs>
<rect width="1040" height="700" fill="#ffffff"/>

<text x="40" y="36" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">OpenMaas pipeline boundary</text>
<text x="40" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">The pipeline owns orchestration and run state; domain services own their own state.</text>
<rect x="40" y="88" width="170" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow)"/>
<text x="125" y="113" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">User / Web UI</text>
<text x="125" y="132" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="middle">goal, resources, observe</text>
<path d="M 210 120 L 250 120" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="230" cy="176" r="11" fill="#2563eb"/><text x="230" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<rect x="250" y="88" width="160" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" filter="url(#shadow)"/>
<text x="330" y="113" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">Gateway</text>
<text x="330" y="132" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b" font-weight="normal" text-anchor="middle">auth · tenant · route</text>
<path d="M 410 120 L 455 120" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
<circle cx="432" cy="176" r="11" fill="#2563eb"/><text x="432" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<rect x="455" y="74" width="545" height="174" rx="14" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
<text x="478" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#1e3a8a" font-weight="700" text-anchor="start">pipeline-service</text>
<text x="478" y="121" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="start">run orchestration &amp; state</text>
<rect x="478" y="142" width="112" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" /><text x="534.0" y="161.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="middle">Run</text>
<rect x="598" y="142" width="112" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" /><text x="654.0" y="161.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="middle">Stage</text>
<rect x="718" y="142" width="112" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" /><text x="774.0" y="161.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="middle">Preflight</text>
<rect x="838" y="142" width="112" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" /><text x="894.0" y="161.0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="600" text-anchor="middle">Lease</text>
<text x="478" y="198" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="start">owns: run lifecycle, snapshots, retry, cancellation, events, cost</text>
<text x="478" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="start">does not own: base model, dataset, artifact, or endpoint state</text>
<rect x="40" y="292" width="960" height="158" rx="14" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.3" filter="url(#shadow)"/>
<text x="62" y="321" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="700" text-anchor="start">Domain services</text>
<text x="62" y="339" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b" font-weight="normal" text-anchor="start">each service keeps its own state machine and database</text>
<rect x="62" y="355" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1" />
<text x="74" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Base model</text>
<text x="74" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">registration · pull · scan</text>
<rect x="218" y="355" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1" />
<text x="230" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Dataset</text>
<text x="230" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">import · scan · version</text>
<rect x="374" y="355" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1" />
<text x="386" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Training</text>
<text x="386" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">jobs · checkpoints · metrics</text>
<rect x="530" y="355" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1" />
<text x="542" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Artifact</text>
<text x="542" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">registration · release</text>
<rect x="686" y="355" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1" />
<text x="698" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Serving</text>
<text x="698" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">endpoints · routing</text>
<rect x="842" y="355" width="146" height="72" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.1" />
<text x="854" y="378" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="600" text-anchor="start">Evaluation</text>
<text x="854" y="397" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="normal" text-anchor="start">sets · tasks · gates</text>
<path d="M 720 248 L 720 275 L 520 275 L 520 292" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
<circle cx="735" cy="273" r="11" fill="#2563eb"/><text x="735" y="277" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="40" y="496" width="460" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
<text x="62" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">Python runtimes</text>
<text x="62" y="543" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="start">puller · trainer · inference · compressor · scanner</text>
<text x="62" y="561" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">WebSocket controlled · no public ingress</text>
<rect x="520" y="496" width="480" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
<text x="542" y="523" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">Infrastructure</text>
<text x="542" y="543" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="start">PostgreSQL · MinIO · Redis · Nacos</text>
<text x="542" y="561" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">persistent state, objects, registry, events</text>
<path d="M 260 450 L 260 475 L 260 496" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<circle cx="245" cy="478" r="11" fill="#2563eb"/><text x="245" y="482" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<path d="M 780 450 L 780 475 L 780 496" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<circle cx="795" cy="478" r="11" fill="#64748b"/><text x="795" y="482" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="40" y="636" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#0f172a" font-weight="700" text-anchor="start">Legend</text>
<path d="M 102 632 L 140 632" fill="none" stroke="#2563eb" stroke-width="1.7" marker-end="url(#arrow-blue)"/>
<text x="148" y="636" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="start">orchestration / call</text>
<path d="M 300 632 L 338 632" fill="none" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
<text x="346" y="636" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="start">state / telemetry</text>
<rect x="505" y="620" width="18" height="12" rx="3" fill="#f8fafc" stroke="#bfdbfe" stroke-width="1" />
<text x="531" y="636" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="start">boundary / owned state</text>
</svg>