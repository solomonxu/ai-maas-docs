<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
<title>OpenMaas pipeline article square cover</title>
<desc>Square share cover for the OpenMaas training-to-inference pipeline article.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#081225"/>
    <stop offset="0.55" stop-color="#0d1b34"/>
    <stop offset="1" stop-color="#102a4d"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60a5fa"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
  </marker>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
</defs>
<rect width="500" height="500" fill="url(#bg)"/>
<rect width="500" height="500" fill="url(#grid)"/>
<rect x="34" y="28" width="4" height="24" rx="2" fill="url(#accent)"/>
<text x="50" y="46" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="15" fill="#93c5fd" font-weight="700" text-anchor="start">OpenMaas</text>
<text x="50" y="64" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#8da4c4" font-weight="normal" text-anchor="start">Building OpenMaas · 01</text>
<text x="50" y="145" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start">把模型训推做成</text>
<text x="50" y="180" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="28" fill="#ffffff" font-weight="700" text-anchor="start">一条可恢复、可计费、</text>
<text x="50" y="215" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="28" fill="#dbeeff" font-weight="700" text-anchor="start">可自动化的流水线</text>
<text x="52" y="248" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#9fb6d4" font-weight="normal" text-anchor="start">从跨服务长事务到可交付的运行</text>
<rect x="50" y="292" width="400" height="150" rx="18" fill="#ffffff" stroke="#ffffff" stroke-width="1" fill-opacity="0.035"/><circle cx="80" cy="329" r="5" fill="#0b1224" stroke="#60a5fa" stroke-width="2"/><circle cx="80" cy="329" r="2" fill="#22d3ee"/><text x="94" y="332" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#e2e8f0" font-weight="700" text-anchor="start">PREFLIGHT</text><text x="94" y="348" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#93a9c7" font-weight="normal" text-anchor="start">validate intent</text><circle cx="270" cy="329" r="5" fill="#0b1224" stroke="#60a5fa" stroke-width="2"/><circle cx="270" cy="329" r="2" fill="#22d3ee"/><text x="284" y="332" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#e2e8f0" font-weight="700" text-anchor="start">RUN</text><text x="284" y="348" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#93a9c7" font-weight="normal" text-anchor="start">own the lifecycle</text><circle cx="80" cy="391" r="5" fill="#0b1224" stroke="#60a5fa" stroke-width="2"/><circle cx="80" cy="391" r="2" fill="#22d3ee"/><text x="94" y="394" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#e2e8f0" font-weight="700" text-anchor="start">LEASE</text><text x="94" y="410" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#93a9c7" font-weight="normal" text-anchor="start">survive failure</text><circle cx="270" cy="391" r="5" fill="#0b1224" stroke="#60a5fa" stroke-width="2"/><circle cx="270" cy="391" r="2" fill="#22d3ee"/><text x="284" y="394" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#e2e8f0" font-weight="700" text-anchor="start">COST</text><text x="284" y="410" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9" fill="#93a9c7" font-weight="normal" text-anchor="start">bill the execution</text>
<text x="50" y="474" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#7f97b8" font-weight="600" text-anchor="start">OPENMAAS</text>
</svg>