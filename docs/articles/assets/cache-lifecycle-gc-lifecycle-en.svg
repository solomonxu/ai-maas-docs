<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<title>Model-Cache Entry Lifecycle and Automatic GC</title><desc>TEMP, COMPLETE, IDLE, EVICTABLE, DELETING; TTL, LRU, watermarks, and active-task protection.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs>
<rect width="1200" height="680" fill="#ffffff"/>
<text x="40" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a" font-weight="700" text-anchor="start">Model-Cache Entry Lifecycle and Automatic GC</text><text x="40" y="66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="400" text-anchor="start">GC starts 5 minutes after worker start and runs every 6 hours. Entries under active load are skipped.</text>
<rect x="40" y="230" width="180" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="130.0" y="260" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">TEMP</text>
<text x="130.0" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">.tmp-* download</text>
<path d="M 220 266 L 268 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="270" y="230" width="180" height="72" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.3"/>
<text x="360.0" y="260" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">COMPLETE</text>
<text x="360.0" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">verified, hittable</text>
<path d="M 450 266 L 498 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="500" y="230" width="180" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="590.0" y="260" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">IDLE</text>
<text x="590.0" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">complete, unused</text>
<path d="M 680 266 L 728 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="730" y="230" width="180" height="72" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3"/>
<text x="820.0" y="260" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">EVICTABLE</text>
<text x="820.0" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">TTL / LRU / watermarks</text>
<path d="M 910 266 L 958 266" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<rect x="960" y="230" width="180" height="72" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
<text x="1050.0" y="260" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">DELETING</text>
<text x="1050.0" y="280" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">removal in progress</text>
<rect x="430" y="100" width="320" height="62" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3"/>
<text x="590" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#1e3a8a" font-weight="700" text-anchor="middle">ACTIVE / PINNED</text>
<text x="590" y="145" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#64748b" font-weight="400" text-anchor="middle">loading or serving; GC skips</text>
<path d="M 590 162 L 590 228" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-blue)"/>
<rect x="40" y="365" width="1120" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60" y="393" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">Triggers and safeguards</text>
<rect x="60" y="403" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="84" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">TEMP -&gt; cleanup</text>
<text x="210" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">incomplete after 1 hour</text>
<rect x="600" y="403" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="624" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">IDLE -&gt; EVICTABLE</text>
<text x="750" y="416" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">unused for 14 days or under capacity pressure</text>
<rect x="60" y="445" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="84" y="458" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">LRU order</text>
<text x="210" y="458" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">oldest .last-used first</text>
<rect x="600" y="445" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="624" y="458" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">Capacity</text>
<text x="750" y="458" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">max 200 GiB; high 85%, low 75%</text>
<rect x="60" y="487" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="84" y="500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">Protection</text>
<text x="210" y="500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">entries under load or active tasks are skipped</text>
<rect x="600" y="487" width="16" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="624" y="500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#0f172a" font-weight="650" text-anchor="start">Delete failure</text>
<text x="750" y="500" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.8" fill="#64748b" font-weight="400" text-anchor="start">retain state, retry next run</text>
<text x="40" y="605" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">Conceptual state model: COMPLETE depends on .complete and the manifest digest; deletion also respects file locks and open files.</text>
<text x="40" y="635" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="400" text-anchor="start">Legacy endpoint directories use cleanup-legacy-model-cache.sh for migration, outside the daily GC path.</text>
</svg>
