<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<title>任务如何使用一块 GPU</title><desc>任务先把模型加载到显存，再获得计算时间执行。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/></filter>
</defs><rect width="1000" height="480" fill="#ffffff"/>

<text x="40" y="38" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="20" fill="#0f172a" font-weight="700" text-anchor="start">任务如何使用一块 GPU</text>
<text x="40" y="61" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" font-weight="normal" text-anchor="start">任务先在显存中放下模型，再获得计算时间执行。</text>
<rect x="40" y="92" width="500" height="300" rx="16" fill="#f8fbff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
<text x="62" y="122" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="16" fill="#1e3a8a" font-weight="700" text-anchor="start">GPU</text>
<rect x="62" y="142" width="456" height="148" rx="12" fill="#ffffff" stroke="#dbe3ef" stroke-width="1.2" />
<text x="78" y="166" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">显存（VRAM）</text>
<text x="78" y="185" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">模型权重 · KV cache · 工作区</text>
<rect x="78" y="202" width="150" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
<text x="88" y="225" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#1e3a8a" font-weight="600" text-anchor="start">权重</text>
<rect x="238" y="202" width="110" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
<text x="248" y="225" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#1e3a8a" font-weight="600" text-anchor="start">KV cache</text>
<rect x="358" y="202" width="100" height="54" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" />
<text x="368" y="225" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#1e3a8a" font-weight="600" text-anchor="start">工作区</text>
<rect x="62" y="304" width="456" height="62" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="78" y="328" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="13" fill="#166534" font-weight="700" text-anchor="start">计算</text>
<text x="78" y="348" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">step · kernel · stream · 推理</text>
<text x="398" y="340" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#166534" font-weight="600" text-anchor="start">执行窗口</text>
<rect x="40" y="410" width="160" height="44" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
<text x="120" y="437" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155" font-weight="600" text-anchor="middle">模型文件</text>
<path d="M 200 432 H 540 V 290 H 518" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
<text x="232" y="469" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="600" text-anchor="start">加载到显存</text>
<rect x="580" y="92" width="380" height="136" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" />
<text x="602" y="120" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">交互任务</text>
<text x="602" y="142" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">翻译 · 对话 · 语音识别</text>
<text x="602" y="166" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="600" text-anchor="start">目标：低延迟</text>
<text x="602" y="188" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="600" text-anchor="start">需要：计算窗口</text>
<rect x="580" y="248" width="380" height="136" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3" />
<text x="602" y="276" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="13" fill="#9a3412" font-weight="700" text-anchor="start">批处理任务</text>
<text x="602" y="298" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b" font-weight="normal" text-anchor="start">文生图 · 训练 · 压缩</text>
<text x="602" y="322" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="600" text-anchor="start">目标：吞吐</text>
<text x="602" y="344" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#334155" font-weight="600" text-anchor="start">需要：显存驻留 + 持续计算</text>
<path d="M 540 260 H 570" fill="none" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-dashed)"/>
</svg>