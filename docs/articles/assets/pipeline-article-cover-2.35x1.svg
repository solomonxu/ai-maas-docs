<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
<title>OpenMaas pipeline article cover</title>
<desc>Cover for the article: Turning model training and inference into a recoverable, cost-aware, automatable pipeline.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#081225"/>
    <stop offset="0.55" stop-color="#0d1b34"/>
    <stop offset="1" stop-color="#102a4d"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60a5fa"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
  </marker>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
  </pattern>
</defs>
<rect width="900" height="383" fill="url(#bg)"/>
<rect width="900" height="383" fill="url(#grid)"/>
<rect x="36" y="30" width="4" height="24" rx="2" fill="url(#accent)"/>
<text x="52" y="48" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="15" fill="#93c5fd" font-weight="700" text-anchor="start">OpenMaas</text>
<text x="52" y="66" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#8da4c4" font-weight="normal" text-anchor="start">Building OpenMaas · 01</text>
<text x="52" y="124" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700" text-anchor="start">把模型训推做成一条</text>
<text x="52" y="164" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="27" fill="#dbeeff" font-weight="700" text-anchor="start">可恢复、可计费、可自动化的流水线</text>
<text x="54" y="206" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="14" fill="#9fb6d4" font-weight="normal" text-anchor="start">从跨服务长事务到可交付的运行</text>
<text x="54" y="232" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="11" fill="#60a5fa" font-weight="600" text-anchor="start">preflight · run · lease · retry · cost</text>
<rect x="598" y="58" width="262" height="268" rx="18" fill="#ffffff" stroke="#ffffff" stroke-width="1" fill-opacity="0.035"/><circle cx="624" cy="100" r="7" fill="#0b1224" stroke="#60a5fa" stroke-width="2"/><circle cx="624" cy="100" r="2.5" fill="#22d3ee"/><text x="644" y="104" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0" font-weight="700" text-anchor="start">PREFLIGHT</text><text x="644" y="121" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#93a9c7" font-weight="normal" text-anchor="start">validate intent</text><path d="M 624 108 L 624 146" fill="none" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arrow)"/><circle cx="624" cy="154" r="7" fill="#0b1224" stroke="#60a5fa" stroke-width="2"/><circle cx="624" cy="154" r="2.5" fill="#22d3ee"/><text x="644" y="158" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0" font-weight="700" text-anchor="start">RUN</text><text x="644" y="175" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#93a9c7" font-weight="normal" text-anchor="start">own the lifecycle</text><path d="M 624 162 L 624 200" fill="none" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arrow)"/><circle cx="624" cy="208" r="7" fill="#0b1224" stroke="#60a5fa" stroke-width="2"/><circle cx="624" cy="208" r="2.5" fill="#22d3ee"/><text x="644" y="212" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0" font-weight="700" text-anchor="start">LEASE</text><text x="644" y="229" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#93a9c7" font-weight="normal" text-anchor="start">survive failure</text><path d="M 624 216 L 624 254" fill="none" stroke="#60a5fa" stroke-width="1.2" marker-end="url(#arrow)"/><circle cx="624" cy="262" r="7" fill="#0b1224" stroke="#60a5fa" stroke-width="2"/><circle cx="624" cy="262" r="2.5" fill="#22d3ee"/><text x="644" y="266" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0" font-weight="700" text-anchor="start">COST</text><text x="644" y="283" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#93a9c7" font-weight="normal" text-anchor="start">bill the execution</text><path d="M 624 216 C 594 238, 594 247, 624 254" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="588" y="242" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="8.5" fill="#fbbf24" font-weight="600" text-anchor="end">retry</text>
<rect x="52" y="305" width="150" height="1" fill="#1e3a5f"/>
<text x="52" y="334" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#7f97b8" font-weight="normal" text-anchor="start">OpenMaas 工程系列</text>
<text x="848" y="334" font-family="Inter, Noto Sans CJK SC, Noto Sans SC, Segoe UI, Arial, sans-serif" font-size="10" fill="#7f97b8" font-weight="600" text-anchor="end">OPENMAAS</text>
</svg>